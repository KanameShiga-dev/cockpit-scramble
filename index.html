<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>コックピット・スクランブル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --phos:#3dff7a; --phos-dim:rgba(61,255,122,.55); --phos-faint:rgba(61,255,122,.2);
  --near:#ff4d4d; --mid:#ffd23d; --far:#3dff7a;
  --void:#000; --panel:rgba(0,14,6,.92);
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --void:#000; } }
:root[data-theme="dark"]{ --void:#000; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;background:var(--void);color:var(--phos);
  font-family:"Chakra Petch","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  touch-action:none;user-select:none;-webkit-user-select:none}
#cam{position:fixed;left:0;top:0;width:100%;height:100%;object-fit:cover;
  filter:grayscale(1) contrast(1.25) brightness(.5) sepia(1) hue-rotate(75deg) saturate(2.4);transition:opacity .3s}
#hud{position:fixed;inset:0;width:100%;height:100%;display:block}
#scan{position:fixed;inset:0;pointer-events:none;background:
  repeating-linear-gradient(to bottom,rgba(0,0,0,.22) 0 1px,transparent 1px 3px),
  radial-gradient(ellipse at 50% 45%,transparent 50%,rgba(0,0,0,.75) 100%)}
#probe{position:fixed;top:0;left:0;height:0;padding-top:env(safe-area-inset-top,0px);visibility:hidden}

#console{position:fixed;left:0;right:0;bottom:0;
  height:calc(min(48vh,360px) + env(safe-area-inset-bottom,0px));
  padding:12px 8% calc(6px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:6px}
#console .frame{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
#console .frame polygon{fill:var(--panel);stroke:var(--phos-dim);stroke-width:1.5;vector-effect:non-scaling-stroke}
.screens{flex:1;min-height:0;display:flex;gap:8px}
.scr{position:relative;border:1px solid var(--phos-faint);background:rgba(0,0,0,.45)}
.scr canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#radarBox{height:100%;aspect-ratio:1/1;max-width:46%}
#monBox{flex:1;min-width:0}
.bars{display:flex;gap:10px}
.gb{flex:1;display:flex;align-items:center;gap:5px;font-size:11px;color:var(--phos-dim);white-space:nowrap}
.bar{flex:1;height:7px;border:1px solid var(--phos-dim);position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--phos);box-shadow:0 0 6px var(--phos);transition:width .15s}
.bar[data-low] i{background:var(--near);box-shadow:0 0 6px var(--near)}
#wpn{font-size:12px;min-height:1.3em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.ctrls{display:flex;gap:5px}
.ctrls button{flex:1;padding:7px 2px;font-size:12px}
.ctrls button[data-alert]{background:var(--near);border-color:var(--near);color:#fff;font-weight:600;animation:alert .5s steps(2) infinite}
@keyframes alert{50%{background:#5a0f0f}}
@media (prefers-reduced-motion:reduce){.ctrls button[data-alert]{animation:none}}
button{font:inherit;font-size:13px;color:var(--phos);background:transparent;border:1px solid var(--phos-dim);padding:7px 12px;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
button[aria-pressed="true"]{background:var(--phos);color:#001a08;font-weight:600}
button:focus-visible{outline:2px solid var(--phos);outline-offset:2px}
#msg{margin:0;font-size:11px;color:var(--phos-dim);min-height:1.3em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-height:520px){
  #console{height:calc(min(52vh,200px) + env(safe-area-inset-bottom,0px));padding-top:7px;gap:4px}
  #msg{display:none}
  .ctrls button{padding:4px 2px}
}

#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.8);padding:16px;touch-action:auto}
#boot[hidden]{display:none}
#boot .card{width:100%;max-width:24rem;max-height:100%;overflow:auto;border:1px solid var(--phos-dim);background:rgba(0,12,5,.95);padding:18px}
#boot h1{margin:0 0 6px;font-size:21px;font-weight:600;letter-spacing:.06em;text-shadow:0 0 10px rgba(61,255,122,.6)}
#boot p{margin:0 0 12px;font-size:12.5px;line-height:1.7;color:var(--phos-dim)}
.machines{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
.mc{text-align:left;padding:9px 11px;display:block;width:100%}
.mc b{display:block;font-size:14.5px;margin-bottom:2px}
.mc span{display:block;font-size:11.5px;line-height:1.55;color:var(--phos-dim)}
.mc[aria-checked="true"]{background:rgba(61,255,122,.14);border-color:var(--phos);box-shadow:inset 3px 0 0 var(--phos)}
.mc[aria-checked="true"] span{color:var(--phos)}
.wl em{font-style:normal}
.wl .n{color:var(--near)} .wl .m{color:var(--mid)} .wl .f{color:var(--far)}
.opt{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:12.5px}
.opt .lbl{color:var(--phos-dim);white-space:nowrap}
.opt .segs{display:flex;flex:1}
.opt .segs button{flex:1;padding:6px 0;font-size:12.5px}
.opt .segs button+button{border-left:none}
.opt input{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--phos);background:transparent;border:1px solid var(--phos-dim);padding:6px 8px}
.opt input:focus-visible{outline:2px solid var(--phos);outline-offset:1px}
.opt input[aria-invalid="true"]{border-color:var(--near)}
#boot p.note{margin:-8px 0 14px;font-size:11.5px}
#boot p.note[data-err]{color:var(--near)}
/* landscape: console docked on the right, main view uses the rest (kept in sync with SIDE_MQ in script) */
@media (orientation:landscape) and (min-aspect-ratio:4/3){
  #console{left:auto;top:0;right:0;bottom:0;height:auto;width:calc(clamp(260px,34vw,380px) + env(safe-area-inset-right,0px));
    padding:calc(10px + env(safe-area-inset-top,0px)) calc(10px + env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) 22px}
  .screens{flex-direction:column}
  #radarBox{flex:0 0 auto;height:min(40%,260px);max-width:100%;align-self:center}
  #monBox{flex:1;min-height:90px}
  #msg{display:block}
  .ctrls button{font-size:11px;padding:6px 1px;white-space:nowrap}
}
#bBoot{width:100%;padding:12px;font-size:15px;font-weight:600;background:var(--phos);color:#001a08;border-color:var(--phos)}
</style>
</head>
<body>
<video id="cam" playsinline muted autoplay style="opacity:0"></video>
<canvas id="hud" aria-label="ヘッドアップディスプレイ"></canvas>
<div id="scan"></div>
<div id="probe"></div>

<section id="console" aria-label="コンソール">
  <svg class="frame" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><polygon id="framePoly" points="8,0 92,0 100,100 0,100"/></svg>
  <div class="screens">
    <div class="scr" id="radarBox"><canvas id="radar" aria-label="レーダーと損傷表示"></canvas></div>
    <div class="scr" id="monBox"><canvas id="mon" aria-label="目標モニター"></canvas></div>
  </div>
  <div class="bars">
    <div class="gb">装甲<span class="bar" id="barA"><i></i></span></div>
    <div class="gb">EN<span class="bar" id="barE"><i></i></span></div>
    <div class="gb">燃料<span class="bar" id="barF"><i></i></span></div>
  </div>
  <div id="wpn">待機中</div>
  <div class="ctrls">
    <button id="bIn" disabled>回避</button>
    <button id="bOut" disabled title="2回押すと作戦から離脱">離脱</button>
    <button id="bCal">正面</button>
    <button id="bBg">背景:CG</button>
    <button id="bSnd" aria-pressed="true">音</button>
  </div>
  <p id="msg" role="status"></p>
</section>

<div id="boot">
  <div class="card">
    <h1 id="bootTitle">機体選択</h1>
    <p id="bootText">機首を向けて敵を探し、1回タップで識別、もう1回で捕捉。機体によっては複数の敵を同時に捕捉できます。攻撃は距離に応じて自動です。</p>
    <div class="machines" role="radiogroup" aria-label="機体" id="machines"></div>
    <div class="opt"><span class="lbl">旋回感度</span>
      <div class="segs" role="radiogroup" aria-label="旋回感度" id="gains"></div></div>
    <div class="opt"><label class="lbl" for="pilot">パイロット名</label>
      <input id="pilot" maxlength="12" autocomplete="nickname" spellcheck="false" placeholder="例：KANAME" aria-describedby="pilotMsg"></div>
    <p id="pilotMsg" class="note">出撃シーンに表示されます（12文字まで）。この端末に保存され、次回も使えます。</p>
    <button id="bBoot">出撃</button>
  </div>
</div>

<script>
(() => {
const $ = s => document.querySelector(s);
const D = Math.PI / 180;
const PHOS = '#3dff7a', DIM = 'rgba(61,255,122,.55)', FAINT = 'rgba(61,255,122,.2)', FAINT2 = 'rgba(61,255,122,.11)';
const FONT = '"Chakra Petch", system-ui, sans-serif';
const NEAR = 150, MID = 500, RMAX = 1200;
const BANDC = { near: '#ff4d4d', mid: '#ffd23d', far: '#3dff7a' };
const BANDJ = { near: '近距離', mid: '中距離', far: '遠距離' };
const bandOf = d => d < NEAR ? 'near' : d < MID ? 'mid' : 'far';
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const wrap180 = a => ((a % 360) + 540) % 360 - 180;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ================= sound =================
const SFX = (() => {
  let ac = null, master = null, on = true, nb = null; const last = {};
  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ac = new AC(); master = ac.createGain(); master.gain.value = 0.5; master.connect(ac.destination);
    nb = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(f0, f1, dur, type, vol, delay = 0) {
    const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.03);
  }
  function noise(dur, vol, type, f0, f1, delay = 0) {
    const t = ac.currentTime + delay, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = nb; s.loop = true; f.type = type;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(f).connect(g).connect(master); s.start(t); s.stop(t + dur + 0.03);
  }
  function ok(k, gap) {
    if (!ac || !on) return false;
    const n = performance.now(); if (last[k] && n - last[k] < gap) return false; last[k] = n; return true;
  }
  return {
    init, toggle() { on = !on; return on; },
    identify() { if (ok('id', 50)) tone(900, 900, 0.06, 'square', 0.1); },
    lock() { if (ok('lock', 50)) { tone(1200, 1200, 0.05, 'square', 0.13); tone(1700, 1700, 0.08, 'square', 0.13, 0.07); } },
    slash() { if (ok('slash', 80)) { noise(0.22, 0.35, 'bandpass', 3200, 500); tone(240, 80, 0.26, 'sawtooth', 0.12); } },
    beam() { if (ok('beam', 60)) { tone(1500, 240, 0.16, 'sawtooth', 0.11); noise(0.08, 0.14, 'highpass', 4000, 2000); } },
    bullet() { if (ok('bul', 65)) noise(0.05, 0.25, 'bandpass', 1900, 900); },
    cannon() { if (ok('can', 100)) { tone(150, 40, 0.6, 'sawtooth', 0.22); noise(0.5, 0.4, 'lowpass', 1500, 80); } },
    rail() { if (ok('rail', 100)) { tone(2600, 180, 0.25, 'sine', 0.22); noise(0.04, 0.4, 'highpass', 6000, 3000); } },
    boom(big) { if (ok(big ? 'bb' : 'boom', 60)) { noise(big ? 1.8 : 0.8, big ? 0.9 : 0.55, 'lowpass', big ? 900 : 1400, 40); tone(90, 28, big ? 1.4 : 0.5, 'sine', 0.4); } },
    hit() { if (ok('hit', 80)) { tone(110, 45, 0.22, 'square', 0.28); noise(0.16, 0.35, 'lowpass', 800, 100); } },
    enemyShot() { if (ok('es', 110)) tone(700, 280, 0.1, 'triangle', 0.06); },
    warn() { if (ok('warn', 1200)) { tone(880, 880, 0.12, 'square', 0.1); tone(660, 660, 0.12, 'square', 0.1, 0.16); } },
    alarm() { if (ok('alarm', 600)) for (let i = 0; i < 3; i++) tone(1000, 1000, 0.1, 'square', 0.16, i * 0.16); },
    dash() { if (ok('dash', 200)) noise(0.6, 0.3, 'bandpass', 400, 2400); },
    lockon() { if (ok('lockon', 250)) for (let i = 0; i < 3; i++) tone(1480, 1480, 0.05, 'square', 0.12, i * 0.08); },
    dodge() { if (ok('dodge', 150)) tone(500, 900, 0.08, 'triangle', 0.08); },
    clear() { if (ok('clr', 500)) [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.2, 'square', 0.1, i * 0.12)); },
    // launch sequence
    boot() { if (ok('boot', 500)) { tone(220, 440, 0.3, 'sine', 0.08); tone(660, 660, 0.08, 'square', 0.06, 0.35); } },
    tick() { if (ok('tick', 60)) tone(1600, 1600, 0.04, 'square', 0.06); },
    green() { if (ok('green', 500)) [784, 1175].forEach((f, i) => tone(f, f, 0.16, 'square', 0.09, i * 0.1)); },
    count(i) { if (ok('count' + i, 300)) i < 2 ? tone(880, 880, 0.14, 'square', 0.12) : tone(1320, 1320, 0.45, 'square', 0.14); },
    catapult() { if (ok('cat', 1000)) { noise(0.35, 0.7, 'lowpass', 2000, 60); tone(120, 40, 0.5, 'sawtooth', 0.25);
      noise(2.2, 0.45, 'bandpass', 300, 3200, 0.1); tone(90, 260, 2.0, 'sawtooth', 0.08, 0.1); } },
    exit() { if (ok('exit', 1000)) noise(1.0, 0.45, 'lowpass', 3000, 200); }
  };
})();

// ================= models =================
// A model is { v: vertices, e: all edges, f: faces, x: face edges, l: detail lines }.
// Parts are convex lofts between rings. Faces carry an outward normal and a shade; face edges know
// their two faces so only silhouettes and hard creases are stroked, which keeps rounded parts smooth.
const mv = { add: (a, b) => [a[0]+b[0], a[1]+b[1], a[2]+b[2]], mul: (a, k) => [a[0]*k, a[1]*k, a[2]*k],
  lerp: (a, b, t) => [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t],
  cross: (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]],
  unit: a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0]/l, a[1]/l, a[2]/l]; } };
const LIGHT = mv.unit([-0.45, 0.75, 0.5]);
const AX = { x: [[0,0,1],[0,1,0]], y: [[1,0,0],[0,0,1]], z: [[1,0,0],[0,1,0]] };
const mdl = () => ({ v: [], e: [], f: [], x: [], l: [] });
const both = fn => { fn(-1); fn(1); };
function rb(c, U, V, w, h, k = 0) { // rectangle (k = 0) or chamfered octagon in the plane spanned by U, V
  const a = w / 2, b = h / 2, ca = a * k, cb = b * k;
  const P = k ? [[-a+ca,-b],[a-ca,-b],[a,-b+cb],[a,b-cb],[a-ca,b],[-a+ca,b],[-a,b-cb],[-a,-b+cb]] : [[-a,-b],[a,-b],[a,b],[-a,b]];
  return P.map(([u, v]) => [c[0] + u*U[0] + v*V[0], c[1] + u*U[1] + v*V[1], c[2] + u*U[2] + v*V[2]]);
}
const rr = (ax, c, w, h, k = 0) => rb(c, AX[ax][0], AX[ax][1], w, h, k);
function ell(ax, c, rx, ry, n = 10) {
  const [U, V] = AX[ax];
  return Array.from({ length: n }, (_, i) => { const t = (i + 0.5) / n * 2 * Math.PI, u = rx * Math.cos(t), v = ry * Math.sin(t);
    return [c[0] + u*U[0] + v*V[0], c[1] + u*U[1] + v*V[1], c[2] + u*U[2] + v*V[2]]; });
}
const circ = (ax, c, r, n = 8) => ell(ax, c, r, r, n);
function hull(m, R) { // loft through rings of equal vertex count
  const n = R[0].length, b = m.v.length, all = R.flat(), last = R.length - 1;
  m.v.push(...all);
  const g = all.reduce((s, p) => mv.add(s, mv.mul(p, 1 / all.length)), [0, 0, 0]);
  const face = ix => {
    const P = ix.map(i => m.v[i]);
    let nx = 0, ny = 0, nz = 0;
    for (let i = 0; i < P.length; i++) { const p = P[i], q = P[(i + 1) % P.length];
      nx += (p[1]-q[1])*(p[2]+q[2]); ny += (p[2]-q[2])*(p[0]+q[0]); nz += (p[0]-q[0])*(p[1]+q[1]); }
    if (Math.hypot(nx, ny, nz) < 1e-6) return -1;
    const c = P.reduce((s, p) => mv.add(s, mv.mul(p, 1 / P.length)), [0, 0, 0]);
    let N = mv.unit([nx, ny, nz]);
    if (N[0]*(c[0]-g[0]) + N[1]*(c[1]-g[1]) + N[2]*(c[2]-g[2]) < 0) N = mv.mul(N, -1);
    const lit = Math.max(0, Math.min(1, (N[0]*LIGHT[0] + N[1]*LIGHT[1] + N[2]*LIGHT[2]) * 0.5 + 0.5));
    m.f.push({ i: ix, n: N, c, s: Math.round(lit * 8) });
    return m.f.length - 1;
  };
  const edge = (p, q, fa, fb) => {
    m.e.push([p, q]);
    const A = m.f[fa], B = m.f[fb];
    m.x.push([p, q, fa, fb, !A || !B || A.n[0]*B.n[0] + A.n[1]*B.n[1] + A.n[2]*B.n[2] < 0.6]);
  };
  const cap0 = face([...Array(n).keys()].map(i => b + i));
  const cap1 = face([...Array(n).keys()].map(i => b + last*n + i));
  const S = [];
  for (let r = 0; r < last; r++) S.push(Array.from({ length: n }, (_, i) => face([b + r*n + i, b + r*n + (i+1) % n, b + (r+1)*n + (i+1) % n, b + (r+1)*n + i])));
  for (let r = 0; r <= last; r++) for (let i = 0; i < n; i++)
    edge(b + r*n + i, b + r*n + (i+1) % n, r === 0 ? cap0 : S[r-1][i], r === last ? cap1 : S[r][i]);
  for (let r = 0; r < last; r++) for (let i = 0; i < n; i++) edge(b + r*n + i, b + (r+1)*n + i, S[r][(i - 1 + n) % n], S[r][i]);
}
function seg(m, a, b) { const i = m.v.length; m.v.push(a, b); m.e.push([i, i + 1]); m.l.push([i, i + 1]); }
function poly(m, P, open) { for (let i = 0; i + (open ? 1 : 0) < P.length; i++) seg(m, P[i], P[(i + 1) % P.length]); }
// rounded pod from a to b: elliptical rings (w across, d the other way) pinched at both ends
const ROUND = [[0, 0.7], [0.2, 0.97], [0.8, 0.97], [1, 0.7]], TUBE = [[0, 1], [1, 1]];
function pod(m, ax, a, b, w0, d0, w1 = w0, d1 = d0, n = 8, prof = ROUND) {
  hull(m, prof.map(([t, k]) => ell(ax, mv.lerp(a, b, t), (w0 + (w1 - w0) * t) / 2 * k, (d0 + (d1 - d0) * t) / 2 * k, n)));
}
// rounded body: rows of [y, width, depth] as ellipses around (x, z)
const Ve = (m, x, z, rows, n = 12) => hull(m, rows.map(([y, w, d]) => ell('y', [x, y, z], w / 2, d / 2, n)));
// a line hugging an ellipse row (for vents and seams on rounded bodies)
function hug(m, y, w, d, x0, x1, zc = 0) {
  const P = []; for (let i = 0; i <= 6; i++) { const x = x0 + (x1 - x0) * i / 6, q = Math.max(0, 1 - (2 * x / w) ** 2);
    P.push([x, y, zc + d / 2 * Math.sqrt(q) + 0.04]); }
  poly(m, P, true);

// blocks for hard-edged hardware (weapons, launchers)

    for (const o of [-0.6, 0.6]) { const p0 = mv.add(mv.add(base, [0, 1.4, 0]), mv.mul(T, o));

function cutView(im, [x, w]) {
  const c = document.createElement('canvas'); c.width = w; c.height = im.height;
  c.getContext('2d').drawImage(im, x, 0, w, im.height, 0, 0, w, im.height);
  return c;
}

  }
  ctx.textAlign = 'center';
  const idx = LAUNCH.count.filter(c => t >= c).length - 1;
  if (idx >= 0 && (idx < 2 || Math.sin(t * 18) > -0.3)) {
    ctx.font = `600 28px ${FONT}`; ctx.fillStyle = LAMPS[idx][1]; ctx.shadowColor = LAMPS[idx][1]; ctx.shadowBlur = 12;
    ctx.fillText(LAMPS[idx][0], x + w / 2, y + 116); ctx.shadowBlur = 0;
  }
  LAMPS.forEach(([name, col], i) => {
    const lx = x + w / 2 + (i - 1) * 70, ly = y + h - 14;
    ctx.beginPath(); ctx.arc(lx - 20, ly, 5, 0, Math.PI * 2);
    ctx.fillStyle = i <= idx ? col : 'rgba(61,255,122,.12)'; ctx.fill(); ctx.strokeStyle = col; ctx.lineWidth = 1; ctx.stroke();
    ctx.font = `600 9px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = i <= idx ? col : DIM; ctx.fillText(name, lx - 12, ly);
    ctx.textBaseline = 'top';
  });
}

// ================= loop =================
let lastT = 0;
function frame(t) {
  const dt = Math.min(0.05, lastT ? (t - lastT) / 1000 : 0); lastT = t; nowS = t / 1000;
  cx = W / 2; cy = viewH() / 2; F = (Math.max(W, H) / 2) / Math.tan(33 * D);
  top = safeTop + 64; bottom = H - consoleBottom - 8;
  if (game.state === 'idle' && !reduceMotion) manYaw = (manYaw + 0.04) % 360;
  if (gotSensor && !manual) smooth(sensorView(), 0.3); else smooth(basisFrom(manYaw, manPitch, 0), 0.25);
  update(dt);

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const sh = reduceMotion ? 0 : game.shake * game.shake * 10;
  ctx.save();
  if (sh > 0.1) ctx.translate(rnd(-sh, sh), rnd(-sh, sh));
  const ev = game.evade;
  if (ev && !reduceMotion) { // evasive move seen from the cockpit
    const k = ev.t / ev.dur, s = Math.sin(k * Math.PI), ease = k * k * (3 - 2 * k);
    ctx.translate(cx, cy);
    if (ev.kind === 'roll') { ctx.translate(-ev.dir * s * W * 0.22, 0); ctx.rotate(ev.dir * ease * Math.PI * 2); }
    else ctx.scale(ev.kind === 'fwd' ? 1 + 0.3 * s : 1 - 0.18 * s, ev.kind === 'fwd' ? 1 + 0.3 * s : 1 - 0.18 * s);
    ctx.translate(-cx, -cy);
  }
  const launching = game.state === 'launch';
  const space = !launching && game.state !== 'idle' && stage().kind === 'space';
  if (launching) drawLaunch();
  else {
    if (space) drawStars();
    else if (bg === 'wire' && camOK && processWire()) {
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.drawImage(wire, 0, 0, W, viewH()); ctx.restore();
    }
    drawSky(!space);
    if (!space && bg !== 'video') drawGround();
    drawEnemies();
    drawFx();
  }
  ctx.restore();
  drawCanopy();
  if (launching) drawLaunchPanel();
  else {
    if (!game.evade || reduceMotion) drawMarkers(); // markers would not line up with the rolling view
    drawTape();
    drawReticle();
    drawOverlayText();
    drawLockWarning();
  }
  if (game.flash > 0) { ctx.fillStyle = `rgba(220,255,232,${game.flash.toFixed(3)})`; ctx.fillRect(0, 0, W, viewH()); }
  drawRadar();
  drawMonitor();
  updateConsole(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ================= input =================
function handleTap(x, y) {
  if (game.state === 'launch') { skipLaunch(); return; }
  if (game.state !== 'play') return;
  let best = null, bd = Infinity;
  for (const e of game.enemies) {
    const c = projP(enemyFrame(e).P);
    if (!c) continue;
    const r = Math.max(26, markSize(e, c[2])) + 14;
    const d = Math.hypot(c[0] - x, c[1] - y);
    if (d < r && d < bd) { bd = d; best = e; }
  }
  if (!best) return;
  if (game.locks.includes(best)) {
    // tapping a locked enemy makes it the primary target
    game.locks = [best, ...game.locks.filter(e => e !== best)]; game.selected = null;
    return;
  }
  if (game.selected === best) {
    game.locks.unshift(best);
    if (game.locks.length > game.m.lockMax) game.locks.length = game.m.lockMax;
    game.selected = null;
    SFX.lock(); say(`${best.T.name} を捕捉。（${game.locks.length}/${game.m.lockMax}）`);
  } else {
    game.selected = best;
    SFX.identify(); say(`${best.T.name} を識別。もう一度タップで捕捉。`);
  }
}
let ptr = null;
hud.addEventListener('pointerdown', e => { ptr = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, moved: false }; hud.setPointerCapture(e.pointerId); });
hud.addEventListener('pointermove', e => {
  if (!ptr) return;
  if (Math.hypot(e.clientX - ptr.sx, e.clientY - ptr.sy) > 8) ptr.moved = true;
  if (ptr.moved) {
    const dx = (e.clientX - ptr.x) * 0.18, dy = (e.clientY - ptr.y) * 0.18;
    if (manual) { manYaw = (manYaw - dx + 360) % 360; manPitch = clamp(manPitch + dy, -85, 85); }
    else { offYaw -= dx; offPitch = clamp(offPitch + dy, -60, 60); }
  }
  ptr.x = e.clientX; ptr.y = e.clientY;
});
hud.addEventListener('pointerup', e => { if (ptr && !ptr.moved) handleTap(e.clientX, e.clientY); ptr = null; });
hud.addEventListener('pointercancel', () => { ptr = null; });
addEventListener('keydown', e => {
  if (game.state === 'launch' && [' ', 'Enter', 'Escape'].includes(e.key)) { skipLaunch(); return; }
  const k ={ ArrowLeft: [-3, 0], ArrowRight: [3, 0], ArrowUp: [0, 3], ArrowDown: [0, -3] }[e.key];
  if (!k) return;
  if (manual) { manYaw = (manYaw + k[0] + 360) % 360; manPitch = clamp(manPitch + k[1], -85, 85); }
  else { offYaw += k[0]; offPitch = clamp(offPitch + k[1], -60, 60); }
});
bIn.addEventListener('click', evade);
bOut.addEventListener('click', withdraw);
$('#bCal').addEventListener('click', calibrate);
$('#bSnd').addEventListener('click', e => { SFX.init(); e.currentTarget.setAttribute('aria-pressed', SFX.toggle()); });

// ================= boot =================
const machinesEl = $('#machines');
for (const [k, m] of Object.entries(MACHINES)) {
  const b = document.createElement('button');
  b.className = 'mc'; b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', k === game.key);
  b.innerHTML = `<b>${m.name}</b><span>${m.desc} 装甲 ${m.armor}・同時捕捉 ${m.lockMax}</span>
    <span class="wl"><em class="n">近</em> ${m.near.name}　<em class="m">中</em> ${m.mid.name}　<em class="f">遠</em> ${m.far.name}</span>`;
  b.addEventListener('click', () => { game.key = k; for (const x of machinesEl.children) x.setAttribute('aria-checked', x === b); });
  machinesEl.appendChild(b);
}
const gainsEl = $('#gains');
for (const g of [1, 1.5, 2]) {
  const b = document.createElement('button');
  b.textContent = `×${g.toFixed(1)}`; b.setAttribute('role', 'radio'); b.setAttribute('aria-pressed', g === gain);
  b.addEventListener('click', () => { gain = g; calH = null; for (const x of gainsEl.children) x.setAttribute('aria-pressed', x === b); });
  gainsEl.appendChild(b);
}

let sensorsAsked = false, camAsked = false;
async function requestSensors() {
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      const r = await DeviceOrientationEvent.requestPermission(); if (r !== 'granted') return;
    }
  } catch (e) { return; }
  addEventListener('deviceorientation', e => {
    if (e.alpha == null && e.beta == null && e.gamma == null) return;
    raw = { a: e.alpha || 0, b: e.beta || 0, g: e.gamma || 0 };
    if (!gotSensor) { gotSensor = true; manual = false; calH = null; }
  });
}
async function startCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('unsupported');
  const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
  video.srcObject = stream; await video.play();
  const st = stream.getVideoTracks()[0].getSettings ? stream.getVideoTracks()[0].getSettings() : {};
  mirror = st.facingMode === 'user' || (!st.facingMode && !('ontouchstart' in window));
  video.style.transform = mirror ? 'scaleX(-1)' : '';
}
// pilot name: required, remembered on this device only
const pilotEl = $('#pilot'), pilotMsg = $('#pilotMsg'), PILOT_KEY = 'cockpitScramble.pilot', pilotHelp = pilotMsg.textContent;
try { pilotEl.value = localStorage.getItem(PILOT_KEY) || ''; } catch (e) {}
pilotEl.addEventListener('input', () => { pilotEl.removeAttribute('aria-invalid'); pilotMsg.removeAttribute('data-err'); pilotMsg.textContent = pilotHelp; });
$('#bBoot').addEventListener('click', async () => {
  const pilot = pilotEl.value.replace(/\s+/g, ' ').trim().slice(0, 12);
  if (!pilot) {
    pilotEl.setAttribute('aria-invalid', 'true'); pilotMsg.setAttribute('data-err', '');
    pilotMsg.textContent = 'パイロット名を入力してください。'; pilotEl.focus();
    return;
  }
  game.pilot = pilot;
  try { localStorage.setItem(PILOT_KEY, pilot); } catch (e) {}
  SFX.init();
  const sp = sensorsAsked ? null : requestSensors();
  sensorsAsked = true;
  $('#boot').hidden = true;
  calH = null;
  startLaunch();
  if (!camAsked) {
    camAsked = true;
    try { await startCamera(); camOK = true; bg = 'video'; applyBackground(); } catch (e) { camOK = false; }
  }
  if (sp) await sp;
  setTimeout(() => {
    if (!gotSensor) { manual = true; say('傾きセンサーが使えません。ドラッグで視点を動かしてください。'); }
  }, 1200);
});
})();
</script>
